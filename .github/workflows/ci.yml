name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (from main): the version is today's date and the day's build number"
        type: boolean
        default: false

# Releases run one at a time, so two can't take the same build number; other runs aren't held up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s tests -t . -v
      - name: Format tests
        run: node --test tests/formats.test.mjs

  version:
    # The version the apps are built with. For a release (run by hand on main with "Publish a release"
    # ticked) it's YYYY.MM.DD.NN: today's UTC date and the day's next build number after the tags
    # already there (01 for the first). Otherwise it's "dev", as in the source.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          RELEASE: ${{ inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            v=$(git ls-remote --tags --refs origin | python3 scripts/release_version.py next)
          else
            v=dev
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  build:
    # Builds the downloadable apps when run by hand (Actions → CI → Run workflow).
    needs: [test, version]
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stamp the version
        # Into __version__ (the window title, the self-test, the Mac app's version) and the page's header.
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_version.py stamp "$VERSION"
      - run: python -m pip install pyinstaller==6.22.3 -r requirements.txt
      - run: pyinstaller --noconfirm opendecodesk-stitch-analyzer.spec
      - name: Self-test the macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: '"dist/OpenDecoDesk Stitch Analyzer.app/Contents/MacOS/OpenDecoDesk Stitch Analyzer" --self-test'
      - name: Self-test the Windows app
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        # A windowed .exe has no console, so the result is its exit status.
        run: |
          $p = Start-Process -FilePath "dist/OpenDecoDesk Stitch Analyzer.exe" -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "self-test exit status $($p.ExitCode)"
          exit $p.ExitCode
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "OpenDecoDesk Stitch Analyzer.app" "OpenDecoDesk-Stitch-Analyzer-macOS-AppleSilicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDecoDesk-Stitch-Analyzer-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe

  release:
    # Publishes the two builds as a GitHub release when run by hand on main with "Publish a release"
    # ticked, tagged v<version> (the tag is created here). The only job that may write.
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release (and its tag)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the downloads
        run: |
          mv "dist/OpenDecoDesk Stitch Analyzer.exe" dist/OpenDecoDesk-Stitch-Analyzer-Windows.exe
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **New:** the version is now the release date and the day's build number (like 2026.11.01.01). It shows in the window's title bar and at the top of the window, beside the OpenDecoDesk name.

          Analyze Tajima .DST, Barudan .DSB and ZSK .DSZ embroidery designs, and convert between them.

          **Downloads**
          - **Windows:** `OpenDecoDesk-Stitch-Analyzer-Windows.exe` — one portable file, nothing to install. It uses Microsoft Edge WebView2, which Windows 10 and 11 already have.
          - **macOS (Apple Silicon):** unzip `OpenDecoDesk-Stitch-Analyzer-macOS-AppleSilicon.zip`. The app isn't signed yet: the first time, right-click it → Open. On an Intel Mac, run it from source (see the README).

          **What it does:** a design preview with long and short stitches, jumps, trims, stops and needle changes marked; a table of long stitches by needle; a threshold grid; a quality report (stitch lengths, density, layering, a run-time estimate); comparing two designs. Converts DST → DSB or DSZ (with a needle map and "Trim before stop") and DSB/DSZ → DST. Everything runs on your computer and works offline.

          DSZ export follows the only public description of the format and hasn't been confirmed on a ZSK machine yet — run a short test design first.
          NOTES
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            dist/OpenDecoDesk-Stitch-Analyzer-Windows.exe \
            dist/OpenDecoDesk-Stitch-Analyzer-macOS-AppleSilicon.zip \
            --repo "$GITHUB_REPOSITORY" --title "OpenDecoDesk Stitch Analyzer $VERSION" --notes-file notes.md
